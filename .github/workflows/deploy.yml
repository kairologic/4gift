name: Deploy site

# On main: build the site and publish it to S3 + CloudFront through GitHub OIDC (no stored AWS keys).
# Values come from repository variables, set once from the stack outputs:
# AWS_ROLE_ARN, SITE_BUCKET, DISTRIBUTION_ID (GiftStoreSite), PUBLIC_CONTACT_URL (ContactUrl from GiftStoreContact),
# SITE_URL=https://4gift.store, and PUBLIC_AMAZON_TAG once Amazon Associates approves the account.
# Skipped until AWS_ROLE_ARN is set.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # No `environment:` here: it would change the OIDC subject to repo:<repo>:environment:<name>, and the deploy
    # role (infra/lib/site-stack.ts) only trusts repo:<repo>:ref:refs/heads/main.
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_CONTACT_URL: ${{ vars.PUBLIC_CONTACT_URL }}
      PUBLIC_AMAZON_TAG: ${{ vars.PUBLIC_AMAZON_TAG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      - run: npm run build
      - name: Publish to S3 and invalidate CloudFront
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" --delete
          aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths '/*' >/dev/null
